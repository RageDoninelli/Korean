<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kimchi - Coreano desde cero</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#CD2E3A">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#CD2E3A; --blue:#0047A0; --ink:#1A1A2E; --paper:#FFFBF5;
  --card:#FFFFFF; --line:#EAE3D8; --muted:#8A8578; --good:#2E8B57;
  --gold:#D4A520;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{margin:0; font-family:'DM Sans',sans-serif; background:var(--paper); color:var(--ink); overscroll-behavior:none;}
.kr{font-family:'Noto Sans KR',sans-serif;}
#app{max-width:480px; margin:0 auto; min-height:100vh; padding-bottom:24px;}

header.top{position:sticky; top:0; z-index:10; background:var(--paper); padding:16px 18px 10px; display:flex; align-items:center; gap:10px; border-bottom:1px solid var(--line);}
header.top .back{font-size:22px; cursor:pointer; color:var(--red); width:28px;}
header.top h1{font-size:19px; margin:0; flex:1;}
header.top .sub{font-size:12px; color:var(--muted); margin-top:2px;}

.hero{padding:22px 18px 8px;}
.hero .brand{display:flex; align-items:center; gap:12px;}
.hero .brand img{width:46px; height:46px; border-radius:12px;}
.hero h1{font-size:24px; margin:0;}
.hero p{color:var(--muted); font-size:14px; margin:4px 0 0;}

.install-banner{margin:14px 18px 0; background:var(--ink); color:#fff; border-radius:14px; padding:12px 14px; display:none; align-items:center; gap:10px; font-size:13px;}
.install-banner.show{display:flex;}
.install-banner button{background:var(--red); color:#fff; border:none; padding:8px 14px; border-radius:8px; font-size:13px; font-weight:700;}
.install-banner .close{margin-left:auto; opacity:.6; font-size:18px; padding:0 4px;}

.modules{padding:14px 18px;}
.mcard{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; margin-bottom:12px; display:flex; align-items:center; gap:14px; cursor:pointer; transition:transform .1s;}
.mcard:active{transform:scale(.98);}
.mcard.locked{opacity:.5; cursor:default;}
.mcard .icon{width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; color:#fff; flex-shrink:0;}
.mcard .icon.c1{background:var(--red);}
.mcard .icon.c2{background:var(--blue);}
.mcard .icon.c3{background:var(--gold);}
.mcard .info{flex:1; min-width:0;}
.mcard .info h3{margin:0 0 2px; font-size:15px;}
.mcard .info p{margin:0; font-size:12.5px; color:var(--muted);}
.mcard .prog{font-size:11px; color:var(--muted); margin-top:6px;}
.mcard .bar{height:5px; background:var(--line); border-radius:3px; margin-top:4px; overflow:hidden;}
.mcard .bar div{height:100%; background:var(--good); border-radius:3px;}

.tabs{display:flex; padding:10px 14px 0; gap:6px; border-bottom:1px solid var(--line); position:sticky; top:57px; background:var(--paper); z-index:9;}
.tab{flex:1; text-align:center; padding:10px 4px; font-size:12.5px; font-weight:600; color:var(--muted); border-bottom:3px solid transparent; cursor:pointer;}
.tab.active{color:var(--red); border-bottom-color:var(--red);}

.grid{display:grid; grid-template-columns:repeat(4,1fr); gap:9px; padding:16px 18px;}
.chip{aspect-ratio:1; background:var(--card); border:1px solid var(--line); border-radius:14px; display:flex; flex-direction:column; align-items:center; justify-content:center; cursor:pointer; position:relative;}
.chip:active{transform:scale(.95);}
.chip .g{font-size:26px; font-weight:700;}
.chip .r{font-size:10px; color:var(--muted); margin-top:2px;}
.chip .dot{position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--line);}
.chip .dot.done{background:var(--good);}

.section-label{padding:14px 18px 0; font-size:12px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.04em;}

/* Flashcard / study screen */
.study-wrap{padding:20px 18px;}
.flash{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:30px 20px; text-align:center; position:relative;}
.flash .glyph{font-size:88px; font-weight:700; margin-bottom:6px;}
.flash .rom{font-size:20px; color:var(--red); font-weight:700; margin-bottom:2px;}
.flash .sound{font-size:13px; color:var(--muted); margin-bottom:16px;}
.flash .audio-btn{width:52px; height:52px; border-radius:50%; background:var(--blue); color:#fff; border:none; font-size:22px; margin-bottom:16px;}
.flash .mnem{background:var(--paper); border-radius:14px; padding:14px; font-size:13.5px; line-height:1.5; text-align:left; color:var(--ink);}
.flash .mnem b{color:var(--red);}
.nav-row{display:flex; gap:10px; margin-top:16px;}
.nav-row button{flex:1; padding:13px; border-radius:12px; border:none; font-size:14px; font-weight:700; cursor:pointer;}
.btn-secondary{background:var(--card); border:1px solid var(--line) !important; color:var(--ink);}
.btn-primary{background:var(--red); color:#fff;}
.btn-primary:disabled{opacity:.4;}
.progress-dots{text-align:center; font-size:12px; color:var(--muted); margin-top:10px;}

/* Writing practice */
.write-wrap{padding:14px 18px;}
.letter-picker{display:flex; gap:8px; overflow-x:auto; padding:4px 0 14px;}
.letter-picker::-webkit-scrollbar{display:none;}
.lp-item{flex-shrink:0; width:42px; height:42px; border-radius:10px; background:var(--card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; font-size:18px; font-weight:700; cursor:pointer;}
.lp-item.active{background:var(--red); color:#fff; border-color:var(--red);}
.write-info{text-align:center; margin-bottom:10px;}
.write-info .g{font-size:20px; font-weight:700;}
.write-info .r{font-size:12px; color:var(--muted);}
.canvas-box{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px; text-align:center;}
canvas{width:100%; aspect-ratio:1; background:var(--paper); border-radius:12px; touch-action:none; border:1px dashed var(--line);}
.write-controls{display:flex; gap:10px; margin-top:12px;}
.write-controls button{flex:1; padding:12px; border-radius:12px; border:1px solid var(--line); background:var(--card); font-weight:700; font-size:13.5px;}
.rep-counter{text-align:center; font-size:12px; color:var(--muted); margin-top:10px;}

/* Quiz */
.quiz-wrap{padding:18px;}
.quiz-progress{display:flex; gap:4px; margin-bottom:18px;}
.quiz-progress div{flex:1; height:5px; border-radius:3px; background:var(--line);}
.quiz-progress div.done{background:var(--good);}
.quiz-glyph{text-align:center; font-size:72px; font-weight:700; margin:24px 0;}
.quiz-options{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
.qopt{padding:16px 8px; border-radius:14px; border:1px solid var(--line); background:var(--card); font-size:16px; font-weight:700; text-align:center; cursor:pointer;}
.qopt.correct{background:var(--good); color:#fff; border-color:var(--good);}
.qopt.wrong{background:var(--red); color:#fff; border-color:var(--red);}
.quiz-result{text-align:center; padding:40px 18px;}
.quiz-result .score{font-size:52px; font-weight:700; color:var(--red);}

.empty-hint{text-align:center; color:var(--muted); font-size:13px; padding:40px 20px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ===================== DATA ===================== */
const CONSONANTS = [
  {g:'ㄱ', rom:'g/k', name:'giyeok', sound:'Como la "g" de "gato" al inicio, o "k" suave dentro de la palabra.',
   mnem:'Su forma es una <b>escuadra de carpintero</b>: una línea vertical que dobla en ángulo recto hacia la derecha. Imagina que estás trazando la esquina de una mesa.'},
  {g:'ㄴ', rom:'n', name:'nieun', sound:'Como la "n" de "nada".',
   mnem:'Parece una <b>L acostada</b> mirando hacia la izquierda — como la lengua tocando la parte de atrás de los dientes de arriba al decir "n".'},
  {g:'ㄷ', rom:'d/t', name:'digeut', sound:'Como la "d" de "dedo" al inicio, o "t" suave dentro de la palabra.',
   mnem:'Es una <b>mesa vista de lado</b>: una línea horizontal arriba, otra abajo, unidas por la izquierda — como una "C" cuadrada abierta a la derecha.'},
  {g:'ㄹ', rom:'r/l', name:'rieul', sound:'Un sonido intermedio entre "r" suave y "l" — la lengua toca el paladar una sola vez.',
   mnem:'Es la letra más compleja: parece un <b>camino en zigzag</b> con varios giros. Piensa en un río serpenteante — de ahí que suene entre "r" y "l".'},
  {g:'ㅁ', rom:'m', name:'mieum', sound:'Como la "m" de "mamá".',
   mnem:'Un <b>cuadrado perfecto</b>. El rey Sejong diseñó esta letra para representar la forma de la <b>boca cerrada</b> al pronunciar "m".'},
  {g:'ㅂ', rom:'b/p', name:'bieup', sound:'Como la "b" de "beso" al inicio, o "p" suave dentro de la palabra.',
   mnem:'Parece una <b>escalera o ventana con barrotes</b> — representa los <b>labios presionados</b> juntos, como al decir "b" o "p".'},
  {g:'ㅅ', rom:'s', name:'siot', sound:'Como la "s" de "sol".',

  {g:'ㅇ', rom:'-/ng', name:'ieung', sound:'Silenciosa al inicio de sílaba (solo sostiene la vocal); suena "ng" al final de sílaba.',

  {g:'ㅈ', rom:'j', name:'jieut', sound:'Como la "y" fuerte de "yo" en Argentina, o la "j" inglesa de "job".',
   mnem:'Es <b>ㅅ (siot) con una línea extra arriba</b> — como el triángulo de "s" pero con un techo, dándole un sonido más marcado.'},
  {g:'ㅊ', rom:'ch', name:'chieut', sound:'Como la "ch" de "chico", pero aspirada (con más aire).',
   mnem:'Es <b>ㅈ con un trazo extra encima</b>, como un sombrerito — cada trazo adicional en hangul suele indicar más aire al pronunciar.'},
  {g:'ㅋ', rom:'k', name:'kieuk', sound:'Como la "k" de "kilo", con fuerza y aire (aspirada).',
   mnem:'Es <b>ㄱ con una línea extra en medio</b> — la escuadra de carpintero, pero con un travesaño que le da más fuerza al sonido.'},
  {g:'ㅌ', rom:'t', name:'tieut', sound:'Como la "t" de "taco", con fuerza y aire (aspirada).',
   mnem:'Es <b>ㄷ con una línea extra arriba</b> — la mesa de digeut, pero con una tapa que la hace sonar más fuerte.'},
  {g:'ㅍ', rom:'p', name:'pieup', sound:'Como la "p" de "papá", con fuerza y aire (aspirada).',
   mnem:'Parece una <b>mesa con cuatro patas</b> vista de frente — versión "reforzada" de ㅂ, con más aire al pronunciarla.'},
  {g:'ㅎ', rom:'h', name:'hieut', sound:'Como la "j" suave del español ("jamón"), o la "h" inglesa de "hello".',
   mnem:'Un <b>círculo con un sombrero y una línea encima</b> — imagina una persona con sombrero soplando aire, como al decir "h".'},
];

const VOWELS = [
  {g:'ㅏ', rom:'a', name:'a', sound:'Como la "a" de "casa".',
   mnem:'Línea vertical con un <b>trazo corto hacia la derecha</b> — el trazo apunta hacia la luz (vocal "clara"), como una rama creciendo hacia el sol.'},
  {g:'ㅑ', rom:'ya', name:'ya', sound:'Como "ya" en "yate".',
   mnem:'Igual que ㅏ pero con <b>dos ramitas</b> en vez de una — la "y" se añade duplicando el trazo.'},
  {g:'ㅓ', rom:'eo', name:'eo', sound:'Como una "o" abierta, entre "o" y "a" — similar al sonido en inglés "law".',
   mnem:'Línea vertical con un <b>trazo corto hacia la izquierda</b> — apunta hacia adentro (vocal "oscura"), lo opuesto a ㅏ.'},
  {g:'ㅕ', rom:'yeo', name:'yeo', sound:'Como "yeo", combinando la "y" con el sonido de ㅓ.',
   mnem:'Igual que ㅓ pero con <b>dos ramitas</b> hacia la izquierda — de nuevo, doble trazo añade la "y".'},
  {g:'ㅗ', rom:'o', name:'o', sound:'Como la "o" de "sol".',
   mnem:'Línea horizontal con un <b>trazo corto hacia arriba</b> — como el sol saliendo sobre el horizonte (vocal clara, apunta hacia arriba).'},
  {g:'ㅛ', rom:'yo', name:'yo', sound:'Como "yo" en "yoga".',
   mnem:'Igual que ㅗ pero con <b>dos rayos</b> hacia arriba — doble trazo, doble "y".'},
  {g:'ㅜ', rom:'u', name:'u', sound:'Como la "u" de "luna".',
   mnem:'Línea horizontal con un <b>trazo corto hacia abajo</b> — como una raíz bajo tierra (vocal oscura, apunta hacia abajo).'},
  {g:'ㅠ', rom:'yu', name:'yu', sound:'Como "yu" en "yugo".',
   mnem:'Igual que ㅜ pero con <b>dos raíces</b> hacia abajo — doble trazo añade la "y".'},
  {g:'ㅡ', rom:'eu', name:'eu', sound:'Un sonido que no existe en español — como una "u" sin redondear los labios, entre "u" e "i".',
   mnem:'Solo una <b>línea horizontal</b>, plana como el <b>horizonte</b> — representa la tierra en el sistema original de Sejong.'},
  {g:'ㅣ', rom:'i', name:'i', sound:'Como la "i" de "isla".',
   mnem:'Solo una <b>línea vertical</b>, recta como una <b>persona de pie</b> — representa al ser humano en el sistema original de Sejong.'},

const ALL = [...CONSONANTS.map(c=>({...c,type:'c'})), ...VOWELS.map(v=>({...v,type:'v'}))];

const COMPOUND_VOWELS = [
  {g:'ㅐ', rom:'ae', name:'ae', sound:'Como la "e" de "perro", entre e y a.',
   mnem:'Combinación de <b>ㅏ + ㅣ</b>: dos líneas verticales con un trazo corto entre ellas. Fusiona los sonidos "a" e "i".'},
  {g:'ㅒ', rom:'yae', name:'yae', sound:'Como "ㅐ" pero con "y" al inicio.',
   mnem:'Combinación de <b>ㅑ + ㅣ</b>: la versión con doble trazo de ㅐ. Es poco frecuente en palabras coreanas.'},
  {g:'ㅔ', rom:'e', name:'e', sound:'Como la "e" de "mesa".',
   mnem:'Combinación de <b>ㅓ + ㅣ</b>. Hoy en día suena casi igual que ㅐ, aunque se escriben distinto.'},
  {g:'ㅖ', rom:'ye', name:'ye', sound:'Como "ㅔ" pero con "y" al inicio.',
   mnem:'Combinación de <b>ㅕ + ㅣ</b>: versión con doble trazo de ㅔ.'},
  {g:'ㅘ', rom:'wa', name:'wa', sound:'Como "wa" en "guante".',
   mnem:'Combinación de <b>ㅗ + ㅏ</b>: une el trazo hacia arriba de ㅗ con el trazo hacia la derecha de ㅏ.'},
  {g:'ㅙ', rom:'wae', name:'wae', sound:'Como "we" en "bien", con w inicial.',
   mnem:'Combinación de <b>ㅗ + ㅐ</b>: ㅗ seguida de la combinación ae.'},
  {g:'ㅚ', rom:'oe', name:'oe', sound:'En el habla moderna suena como "we".',

  {g:'ㅝ', rom:'wo', name:'wo', sound:'Como "wo" en "won" (la moneda coreana).',

  {g:'ㅞ', rom:'we', name:'we', sound:'Como "we" en "web".',
   mnem:'Combinación de <b>ㅜ + ㅔ</b>: ㅜ seguida de la combinación e.'},
  {g:'ㅟ', rom:'wi', name:'wi', sound:'Como "wi" en "kiwi".',
   mnem:'Combinación de <b>ㅜ + ㅣ</b>: el trazo hacia abajo de ㅜ junto a una línea vertical.'},
  {g:'ㅢ', rom:'ui', name:'ui', sound:'Sonido único: entre "eu" e "i" dichos rápido y seguidos. Su pronunciación cambia según la posición en la palabra.',

const DOUBLE_CONSONANTS = [

  {g:'ㄸ', rom:'tt', name:'ssang-digeut', sound:'Como ㄷ pero tensa, sin aire.',

  {key:'d', rom:'[t]', letters:'ㄷ, ㅅ, ㅈ, ㅊ, ㅌ, ㅎ, ㅆ', word:'옷', wordRom:'ot', meaning:'ropa',

  {key:'l', rom:'[l]', letters:'ㄹ', word:'물', wordRom:'mul', meaning:'agua',

const M2_KEYS = [...COMPOUND_VOWELS.map(x=>x.g), ...DOUBLE_CONSONANTS.map(x=>x.g), ...BATCHIM_GROUPS.map(x=>'batchim-'+x.key)];

/* ---------- Module 3: Lecto-escritura ---------- */
const INITIALS = [
  {g:'ㄱ',rom:'g'},{g:'ㄲ',rom:'kk'},{g:'ㄴ',rom:'n'},{g:'ㄷ',rom:'d'},{g:'ㄸ',rom:'tt'},
  {g:'ㄹ',rom:'r/l'},{g:'ㅁ',rom:'m'},{g:'ㅂ',rom:'b'},{g:'ㅃ',rom:'pp'},{g:'ㅅ',rom:'s'},
  {g:'ㅆ',rom:'ss'},{g:'ㅇ',rom:''},{g:'ㅈ',rom:'j'},{g:'ㅉ',rom:'jj'},{g:'ㅊ',rom:'ch'},
  {g:'ㅋ',rom:'k'},{g:'ㅌ',rom:'t'},{g:'ㅍ',rom:'p'},{g:'ㅎ',rom:'h'}

const MEDIALS = [
  {g:'ㅏ',rom:'a'},{g:'ㅐ',rom:'ae'},{g:'ㅑ',rom:'ya'},{g:'ㅒ',rom:'yae'},{g:'ㅓ',rom:'eo'},
  {g:'ㅔ',rom:'e'},{g:'ㅕ',rom:'yeo'},{g:'ㅖ',rom:'ye'},{g:'ㅗ',rom:'o'},{g:'ㅘ',rom:'wa'},
  {g:'ㅙ',rom:'wae'},{g:'ㅚ',rom:'oe'},{g:'ㅛ',rom:'yo'},{g:'ㅜ',rom:'u'},{g:'ㅝ',rom:'wo'},
  {g:'ㅞ',rom:'we'},{g:'ㅟ',rom:'wi'},{g:'ㅠ',rom:'yu'},{g:'ㅡ',rom:'eu'},{g:'ㅢ',rom:'ui'},{g:'ㅣ',rom:'i'}
]; // index === unicode medial index (0-20)
const FINAL_OPTIONS = [
  {g:'—', rom:'', idx:0},
  {g:'ㄱ', rom:'k', idx:1},
  {g:'ㄴ', rom:'n', idx:4},
  {g:'ㄷ', rom:'t', idx:7},
  {g:'ㄹ', rom:'l', idx:8},
  {g:'ㅁ', rom:'m', idx:16},
  {g:'ㅂ', rom:'p', idx:17},
  {g:'ㅇ', rom:'ng', idx:21},
];
function composeSyllable(iIdx, mIdx, fIdx){

/* ===================== STATE / STORAGE ===================== */
const STORE_KEY = 'kimchi_progress_v1';
function loadProgress(){
  try{ return JSON.parse(localStorage.getItem(STORE_KEY)) || {studied:{}, quizBest:0}; }
  catch(e){ return {studied:{}, quizBest:0}; }
}
function saveProgress(p){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(p)); }catch(e){} }
let progress = loadProgress();
function markStudied(g){ progress.studied[g]=true; saveProgress(progress); }
function completionFor(keys){
  const done = keys.filter(k=>progress.studied[k]).length;
  return Math.round((done/keys.length)*100);
}

function setBuilder(which, i){
  if(which==='i') builderState.iIdx = i;
  if(which==='m') builderState.mIdx = i;
  if(which==='f') builderState.fIdx = i;
  progress.studied['m3-builder'] = true; saveProgress(progress);
  renderSyllables();

function updateBuilderPreview(){
  const fOpt = FINAL_OPTIONS[builderState.fIdx];
  const syll = composeSyllable(builderState.iIdx, builderState.mIdx, fOpt.idx);
  const iRom = INITIALS[builderState.iIdx].rom.split('/')[0];
  const mRom = MEDIALS[builderState.mIdx].rom;
  const rom = iRom + mRom + fOpt.rom;
  document.getElementById('builderPreview').textContent = syll;
  document.getElementById('builderRom').textContent = 'Romanización aproximada: ' + rom;
}

    <p>${desc}</p>
    <button class="btn-primary" style="padding:14px 28px; border-radius:12px; border:none; font-weight:700; margin-top:10px;" onclick="startWordQuiz()">Comenzar</button>
  </div>`;
  app.appendChild(wrap);
}
function startWordQuiz(){
  const total = Math.min(10, VOCAB.length);
  const shuffled = [...VOCAB].sort(()=>Math.random()-0.5).slice(0,total);
  wordQuizState = {...wordQuizState, q:0, correct:0, total, sequence:shuffled};
  nav({screen:'wordquiz'});
}
function renderWordQuiz(){
  if(wordQuizState.q >= wordQuizState.total) return renderWordQuizResult();
  const item = wordQuizState.sequence[wordQuizState.q];
  const sameGroup = VOCAB.filter(x=>x.hangul!==item.hangul && x.group===item.group);
  const otherGroup = VOCAB.filter(x=>x.hangul!==item.hangul && x.group!==item.group);
  const distractors = [...sameGroup, ...otherGroup].sort(()=>Math.random()-0.5).slice(0,3);
  const opts = [item, ...distractors].sort(()=>Math.random()-0.5);
  const isDictado = wordQuizState.mode==='dictado';
  app.innerHTML = `
    <header class="top">
      <div class="back" onclick='nav(${JSON.stringify(wordQuizState.back)})'>‹</div>
      <div><h1>${isDictado?'Dictado':'Repaso'}</h1><div class="sub">Pregunta ${wordQuizState.q+1} de ${wordQuizState.total}</div></div>
    </header>
    <div class="quiz-wrap">
      <div class="quiz-progress">${wordQuizState.sequence.map((_,i)=>`<div class="${i<wordQuizState.q?'done':''}"></div>`).join('')}</div>
      ${isDictado ? `
        <div style="text-align:center; color:var(--muted); font-size:13px;">Escucha y elige la palabra correcta</div>
        <div style="text-align:center; margin:24px 0;"><button class="audio-btn" style="width:64px; height:64px; font-size:28px;" onclick="speak('${item.hangul}')">🔊</button></div>
        <div class="quiz-options">
          ${opts.map(o=>`<div class="qopt kr" style="font-size:19px;" onclick="answerWordQuiz('${o.hangul}','${item.hangul}',this)">${o.hangul}</div>`).join('')}
        </div>
      ` : `
        <div style="text-align:center; color:var(--muted); font-size:13px;">¿Qué significa esta palabra?</div>
        <div class="quiz-glyph kr" style="font-size:46px;">${item.hangul}</div>
        <div style="text-align:center; margin-bottom:14px;"><button class="audio-btn" onclick="speak('${item.hangul}')">🔊</button></div>
        <div class="quiz-options" style="grid-template-columns:1fr;">
          ${opts.map(o=>`<div class="qopt" style="font-size:14px; text-align:left;" onclick="answerWordQuiz('${o.hangul}','${item.hangul}',this)">${o.meaning}</div>`).join('')}
        </div>
      `}
    </div>
  `;
}
function answerWordQuiz(chosenHangul, correctHangul, el){
  const opts = document.querySelectorAll('.qopt');
  opts.forEach(o=>o.onclick=null);
  const isCorrect = chosenHangul === correctHangul;
  if(isCorrect){ el.classList.add('correct'); wordQuizState.correct++; }
  else{
    el.classList.add('wrong');
    const correctItem = VOCAB.find(x=>x.hangul===correctHangul);
    const correctText = wordQuizState.mode==='dictado' ? correctItem.hangul : correctItem.meaning;
    opts.forEach(o=>{ if(o.textContent===correctText) o.classList.add('correct'); });
  }
  setTimeout(()=>{ wordQuizState.q++; render(); }, 800);
}
function renderWordQuizResult(){
  const pct = Math.round((wordQuizState.correct/wordQuizState.total)*100);
  const bestKey = 'quizBest_m3_'+wordQuizState.mode;
  if(!progress[bestKey] || pct > progress[bestKey]){ progress[bestKey] = pct; saveProgress(progress); }
  app.innerHTML = `
    <header class="top">
      <div class="back" onclick='nav(${JSON.stringify(wordQuizState.back)})'>‹</div>
      <div><h1>Resultado</h1></div>
    </header>
    <div class="quiz-result">
      <div class="score">${wordQuizState.correct}/${wordQuizState.total}</div>
      <p style="color:var(--muted);">${pct}% correcto — mejor puntaje: ${progress[bestKey]}%</p>
      <button class="btn-primary" style="padding:14px 28px; border-radius:12px; border:none; font-weight:700; margin-top:14px;" onclick="startWordQuiz()">Repetir</button>
    </div>
  `;
}


let writeState = {index:0, rep:1, list:ALL, mod:'m1'};

function selectWriteLetter(i){ writeState.index = i; writeState.rep = 1; drawWriteScreen(document.querySelector('.write-wrap')); }
function nextRep(){

  markStudied(writeState.list[writeState.index].g);
  drawWriteScreen(document.querySelector('.write-wrap'));

let canvasCtx, drawing=false, guideOpacity;
function setupCanvas(glyph){
  const canvas = document.getElementById('traceCanvas');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.width * dpr; // square
  canvasCtx = canvas.getContext('2d');
  canvasCtx.scale(dpr, dpr);
  canvasCtx.lineWidth = 10;
  canvasCtx.lineCap = 'round';
  canvasCtx.lineJoin = 'round';
  canvasCtx.strokeStyle = '#1A1A2E';
  guideOpacity = Math.max(0.06, 0.32 - (writeState.rep-1)*0.06); // fades as reps increase
  drawGuide(canvas, rect.width, glyph);

  const pos = e => {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {x: t.clientX - r.left, y: t.clientY - r.top};
  };
  const start = e => { e.preventDefault(); drawing=true; const p=pos(e); canvasCtx.beginPath(); canvasCtx.moveTo(p.x,p.y); };
  const move = e => { if(!drawing) return; e.preventDefault(); const p=pos(e); canvasCtx.lineTo(p.x,p.y); canvasCtx.stroke(); };
  const end = e => { drawing=false; };

  canvas.onmousedown=start; canvas.onmousemove=move; canvas.onmouseup=end; canvas.onmouseleave=end;
  canvas.ontouchstart=start; canvas.ontouchmove=move; canvas.ontouchend=end;

  canvas._glyph = glyph; canvas._size = rect.width;
}
function drawGuide(canvas, size, glyph){
  canvasCtx.save();
  canvasCtx.globalAlpha = guideOpacity;
  canvasCtx.font = `700 ${size*0.6}px 'Noto Sans KR', sans-serif`;
  canvasCtx.textAlign = 'center';
  canvasCtx.textBaseline = 'middle';
  canvasCtx.fillStyle = '#1A1A2E';
  canvasCtx.fillText(glyph, size/2, size/2 + size*0.03);
  canvasCtx.restore();
}
function clearCanvas(){
  const canvas = document.getElementById('traceCanvas');
  canvasCtx.clearRect(0,0,canvas.width,canvas.height);
  drawGuide(canvas, canvas._size, canvas._glyph);
}

/* ---------- Quiz ---------- */
let quizState = {q:0, correct:0, total:10, sequence:[], pool:ALL, back:{screen:'m1',tab:'repaso'}, moduleLabel:'Módulo 1'};
function renderQuizIntro(pool, mod, backRoute){
  const label = mod==='m2' ? 'Módulo 2' : 'Módulo 1';
  quizState.pool = pool; quizState.back = backRoute; quizState.moduleLabel = label; quizState.bestKey = 'quizBest_'+mod;
  const wrap = document.createElement('div');
  wrap.innerHTML = `<div class="empty-hint">
    <p style="font-size:15px; color:var(--ink); font-weight:700;">Repaso de ${label}</p>
    <p>10 preguntas de opción múltiple.</p>
    <button class="btn-primary" style="padding:14px 28px; border-radius:12px; border:none; font-weight:700; margin-top:10px;" onclick="startQuiz()">Comenzar repaso</button>
  </div>`;
  app.appendChild(wrap);
}
function startQuiz(){
  const total = Math.min(10, quizState.pool.length);
  const shuffled = [...quizState.pool].sort(()=>Math.random()-0.5).slice(0,total);
  quizState = {...quizState, q:0, correct:0, total, sequence:shuffled};
  nav({screen:'quiz'});
}
function renderQuiz(){
  if(quizState.q >= quizState.total) return renderQuizResult();
  const item = quizState.sequence[quizState.q];
  const wrongPool = quizState.pool.filter(x=>x.g!==item.g && x.type===item.type);
  const opts = [item, ...wrongPool.sort(()=>Math.random()-0.5).slice(0,3)].sort(()=>Math.random()-0.5);
  app.innerHTML = `
    <header class="top">
      <div class="back" onclick='nav(${JSON.stringify(quizState.back)})'>‹</div>
      <div><h1>Repaso</h1><div class="sub">Pregunta ${quizState.q+1} de ${quizState.total}</div></div>
    </header>
    <div class="quiz-wrap">
      <div class="quiz-progress">${quizState.sequence.map((_,i)=>`<div class="${i<quizState.q?'done':''}"></div>`).join('')}</div>
      <div style="text-align:center; color:var(--muted); font-size:13px;">¿Cuál es la romanización de esta letra?</div>
      <div class="quiz-glyph kr">${item.g}</div>
      <div class="quiz-options" id="quizOpts">
        ${opts.map(o=>`<div class="qopt" onclick="answerQuiz('${o.g.replace(/'/g,"\\'")}','${item.g.replace(/'/g,"\\'")}',this)">${o.rom}</div>`).join('')}
      </div>
    </div>
  `;
}
function answerQuiz(chosenG, correctG, el){
  const opts = document.querySelectorAll('.qopt');
  opts.forEach(o=>o.onclick=null);
  const isCorrect = chosenG === correctG;
  if(isCorrect){ el.classList.add('correct'); quizState.correct++; }
  else{
    el.classList.add('wrong');
    opts.forEach(o=>{ if(o.textContent === quizState.pool.find(x=>x.g===correctG).rom) o.classList.add('correct'); });
  }
  setTimeout(()=>{ quizState.q++; render(); }, 800);
}
function renderQuizResult(){
  const pct = Math.round((quizState.correct/quizState.total)*100);
  const bestKey = quizState.bestKey || 'quizBest_m1';
  if(!progress[bestKey] || pct > progress[bestKey]){ progress[bestKey] = pct; saveProgress(progress); }
  app.innerHTML = `
    <header class="top">
      <div class="back" onclick='nav(${JSON.stringify(quizState.back)})'>‹</div>
      <div><h1>Resultado</h1></div>
    </header>
    <div class="quiz-result">
      <div class="score">${quizState.correct}/${quizState.total}</div>
      <p style="color:var(--muted);">${pct}% correcto — mejor puntaje: ${progress[bestKey]}%</p>
      <button class="btn-primary" style="padding:14px 28px; border-radius:12px; border:none; font-weight:700; margin-top:14px;" onclick="startQuiz()">Repetir repaso</button>
    </div>
  `;
}

/* ===================== AUDIO (TTS) ===================== */
function speak(text){
  if(!('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'ko-KR';
  u.rate = 0.75;
  const voices = speechSynthesis.getVoices();
  const kr = voices.find(v=>v.lang && v.lang.toLowerCase().startsWith('ko'));
  if(kr) u.voice = kr;
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
}
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged = ()=>{}; }

/* ===================== PWA install ===================== */
let deferredPrompt;
window.addEventListener('beforeinstallprompt', e=>{
  e.preventDefault();
  deferredPrompt = e;
  const b = document.getElementById('installBanner');
  if(b && !localStorage.getItem('kimchi_install_dismissed')) b.classList.add('show');
});
function setupInstallBanner(){
  const btn = document.getElementById('installBtn');
  const closeBtn = document.getElementById('closeBanner');
  if(btn) btn.onclick = async ()=>{
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    document.getElementById('installBanner').classList.remove('show');
  };
  if(closeBtn) closeBtn.onclick = ()=>{
    document.getElementById('installBanner').classList.remove('show');
    localStorage.setItem('kimchi_install_dismissed','1');
  };
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{ navigator.serviceWorker.register('sw.js').catch(()=>{}); });
}
